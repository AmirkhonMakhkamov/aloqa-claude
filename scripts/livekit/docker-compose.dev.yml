services:
  livekit-server:
    image: livekit/livekit-server:v1.10.0
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No host port mapping: livekit-server reaches redis via the compose network
    # (service DNS `redis:6379`). Exposing 6379 on the host collides with other
    # local redis instances and is unnecessary for dev.
    volumes:
      - livekit-redis-data:/data

  # ALK-701: LiveKit Egress records a room-composite (grid) MP4. It joins the
  # compose network (reaches livekit at ws://livekit-server:7880 and redis:6379
  # by DNS — no network_mode: host, which does not work on macOS Docker). For
  # local file output it writes /out/recordings/<callId>/<recordingId>.mp4;
  # EGRESS_OUTPUT_DIR MUST be the SAME host directory as the API's
  # MEDIA_STORAGE_PATH so the API's local storage resolves the same key. For
  # production set MEDIA_STORAGE_BACKEND=s3|minio instead and egress uploads to
  # the bucket directly (see livekit.production.example.yaml).
  egress:
    image: livekit/egress:latest
    restart: unless-stopped
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
      - ${EGRESS_OUTPUT_DIR:-../../storage}:/out
    cap_add:
      # Required for the headless Chrome sandbox used by room-composite egress.
      - SYS_ADMIN
    shm_size: 1gb
    depends_on:
      - redis
      - livekit-server

volumes:
  livekit-redis-data:
