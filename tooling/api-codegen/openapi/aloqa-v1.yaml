            schema: { $ref: '#/components/schemas/UpdateCallMediaRequest' }
      responses:
        '204': { description: Media state updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # Screen-share permission controls (ALK-697).
  /api/v1/workspaces/{workspaceID}/calls/{callID}/share-requests:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/CallID'
    post:
      summary: Request permission to screen-share (self)
      tags: [calls]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Screen-share request broadcast to the host }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/workspaces/{workspaceID}/calls/{callID}/share-requests/{requesterUserID}/resolve:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/CallID'
