                type: array
                items: { $ref: '#/components/schemas/CallParticipant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/workspaces/{workspaceID}/calls/{callID}/join:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/CallID'
    post:
      summary: Current user joins the call
      tags: [calls]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Joined participant entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinCallResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/workspaces/{workspaceID}/calls/{callID}/leave:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/CallID'
    post:
      summary: Current user leaves the call
      tags: [calls]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Leave result
          content:
            application/json:
