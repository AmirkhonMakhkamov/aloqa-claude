openapi: 3.0.3
info:
  title: Aloqa Backend API
  version: '1.0.0'
  description: |
    Hand-authored OpenAPI 3.0 spec covering the backend routes Phase 3 + Phase 4
    consume (per AD-7 in docs/plan/p3_parallel-tracks-plan.md and AD-9 in
    docs/plan/p4_parallel-tracks-plan.md). The spec is the source of truth;
    `tooling/api-codegen` runs `openapi-typescript` against it to emit
    `packages/core/src/api/generated/_generated.ts`.

    Pinned to `aloqa-claude@3f92356` — see `PINNED_BACKEND.txt`. Re-pinning is
    its own PR.

    Excluded from this spec (post-Phase-4 roadmap): `/api/v1/recordings/*`,
    `/api/v1/breakout-rooms/*`, waiting-room, top-level `/media-session/*`
    (admin/SFU surface — distinct from per-call sub-paths, which ARE vendored),
    `admin/{media,observability,storage}`.

servers:
  - url: http://localhost:8080
    description: Local dev backend.

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  # -- Auth -----------------------------------------------------------------
  /api/v1/auth/register:
    post:
      summary: Register a new user account
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '200':
          description: New user + tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/auth/login:
    post:
      summary: Exchange credentials for an access + refresh token
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Account is deactivated or suspended. Error code is `ACCOUNT_DEACTIVATED` or `ACCOUNT_SUSPENDED`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/auth/reactivate-and-login:
    post:
      summary: Reactivate a deactivated account and issue a session
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Reactivated authenticated session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Account is suspended, already active, or otherwise ineligible for reactivation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/auth/refresh:
    post:
      summary: Rotate the refresh token and return a new access token
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Refreshed access + refresh tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/logout:
    post:
      summary: Invalidate a refresh-token session
      tags: [auth]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id: { $ref: '#/components/schemas/UUID' }
      responses:
        '204': { description: Logged out }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { description: Session revocation failed }

  /api/v1/auth/logout-all:
    post:
      summary: Invalidate every refresh token for the current user
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: All sessions invalidated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { description: Session revocation failed }

  /api/v1/auth/logout-others:
    post:
      summary: Invalidate every refresh token except the caller's current session
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Other sessions invalidated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { description: Session revocation failed }

  /api/v1/auth/sessions:
    get:
      summary: List active sessions for the current user
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuthSessionListEntry' }

  # -- Users / Account ------------------------------------------------------
  /api/v1/users/me:
    get:
      summary: Current user profile
      tags: [users]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      summary: Update display name / locale / avatar
      tags: [users]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  /api/v1/users/me/deactivate:
    post:
      summary: Deactivate the authenticated user's account
      tags: [users]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Account deactivated and sessions revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Account is not allowed to self-deactivate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { description: Deactivation failed }

  # -- Workspaces -----------------------------------------------------------
  /api/v1/workspaces:
    get:
      summary: List workspaces the user is a member of
      tags: [workspaces]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Workspace list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Workspace' }
    post:
      summary: Create a new organization workspace
      tags: [workspaces]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkspaceRequest' }
      responses:
        '201':
          description: Created workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }

  /api/v1/workspaces/{workspaceID}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
    get:
      summary: Fetch a single workspace by id
      tags: [workspaces]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '404': { $ref: '#/components/responses/NotFound' }

  # -- Personal workspace ---------------------------------------------------
  /api/v1/personal:
    get:
      summary: Fetch the caller's personal workspace
      tags: [workspaces]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Personal workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }

  # -- Workspace member directory (non-admin) ------------------------------
  /api/v1/workspaces/{workspaceID}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
    get:
      summary: List workspace members (callable by any member)
      tags: [workspaces]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkspaceMember' }

  # -- Channels (workspace-scoped) -----------------------------------------
  /api/v1/workspaces/{workspaceID}/channels:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
    get:
      summary: List channels in a workspace
      tags: [channels]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Channels
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Channel' }
    post:
      summary: Create a channel in a workspace
      tags: [channels]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateChannelRequest' }
      responses:
        '201':
          description: Created channel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }

  /api/v1/workspaces/{workspaceID}/channels/dm:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
    post:
      summary: Open or fetch a DM channel
      tags: [channels]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDmRequest' }
      responses:
        '200':
          description: DM channel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }

  /api/v1/workspaces/{workspaceID}/channels/unread:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
    get:
      summary: Per-channel unread counts for the caller
      tags: [channels]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Unread counts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChannelUnreadCount' }

  /api/v1/workspaces/{workspaceID}/channels/{channelID}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/ChannelID'
    get:
      summary: Fetch a channel
      tags: [channels]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Channel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }
    put:
      summary: Update a channel (name / topic / archived)
      tags: [channels]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateChannelRequest' }
      responses:
        '200':
          description: Updated channel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Channel' }

  /api/v1/workspaces/{workspaceID}/channels/{channelID}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/ChannelID'
    get:
      summary: List channel members
      tags: [channels]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Channel members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChannelMember' }
    post:
      summary: Add channel members
      tags: [channels]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddChannelMembersRequest' }
      responses:
        '200':
          description: Added channel members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChannelMember' }

  /api/v1/workspaces/{workspaceID}/channels/{channelID}/members/{userID}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/ChannelID'
      - name: userID
        in: path
        required: true
        schema: { $ref: '#/components/schemas/UUID' }
    delete:
      summary: Remove a channel member
      tags: [channels]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Removed channel member }

  /api/v1/workspaces/{workspaceID}/channels/{channelID}/read:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/ChannelID'
    post:
      summary: Mark the channel read at the given message
      tags: [channels]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkReadRequest' }
      responses:
        '204': { description: Marked read }

  # -- Messages -------------------------------------------------------------
  /api/v1/workspaces/{workspaceID}/channels/{channelID}/messages:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/ChannelID'
    get:
      summary: List channel messages (paginated)
      tags: [messages]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: before
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Messages, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Message' }
    post:
      summary: Send a message to a channel
      tags: [messages]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '201':
          description: Created message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }

  /api/v1/workspaces/{workspaceID}/channels/{channelID}/messages/{messageID}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/ChannelID'
      - $ref: '#/components/parameters/MessageID'
    put:
      summary: Edit a message (author only)
      tags: [messages]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditMessageRequest' }
      responses:
        '200':
          description: Updated message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
    delete:
      summary: Delete a message
      tags: [messages]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }

  /api/v1/workspaces/{workspaceID}/channels/{channelID}/messages/{messageID}/move:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/ChannelID'
      - $ref: '#/components/parameters/MessageID'
    post:
      summary: Move a message to another channel or thread
      tags: [messages]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveMessageRequest' }
      responses:
        '200':
          description: Moved message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }

  /api/v1/workspaces/{workspaceID}/channels/{channelID}/messages/{messageID}/thread:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/ChannelID'
      - $ref: '#/components/parameters/MessageID'
    get:
      summary: List thread replies for a message
      tags: [messages]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Thread replies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Message' }

  /api/v1/workspaces/{workspaceID}/channels/{channelID}/messages/{messageID}/pin:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/ChannelID'
      - $ref: '#/components/parameters/MessageID'
    post:
      summary: Pin a message
      tags: [messages]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Pinned }
    delete:
      summary: Unpin a message
      tags: [messages]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Unpinned }

  # -- Reactions ------------------------------------------------------------
  /api/v1/workspaces/{workspaceID}/channels/{channelID}/messages/{messageID}/reactions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/ChannelID'
      - $ref: '#/components/parameters/MessageID'
    post:
      summary: Add a reaction to a message
      tags: [reactions]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddReactionRequest' }
      responses:
        '201':
          description: Created reaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reaction' }

  /api/v1/workspaces/{workspaceID}/channels/{channelID}/messages/{messageID}/reactions/{emoji}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/ChannelID'
      - $ref: '#/components/parameters/MessageID'
      - name: emoji
        in: path
        required: true
        schema: { type: string }
    delete:
      summary: Remove the caller's reaction matching the emoji
      tags: [reactions]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Removed }

  /api/v1/reactions/{reactionID}:
    parameters:
      - $ref: '#/components/parameters/ReactionID'
    delete:
      summary: Remove the caller's reaction by reaction ID
      tags: [reactions]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # -- Attachments ----------------------------------------------------------
  /api/v1/workspaces/{workspaceID}/channels/{channelID}/messages/{messageID}/attachments:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/ChannelID'
      - $ref: '#/components/parameters/MessageID'
    post:
      summary: Upload an attachment for a message (multipart)
      tags: [attachments]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        '201':
          description: Created attachment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }

  # -- Presence -------------------------------------------------------------
  /api/v1/workspaces/{workspaceID}/presence:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
    get:
      summary: List currently-online users in a workspace
      tags: [presence]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Presence list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PresenceEntry' }
    put:
      summary: Set the caller's presence status
      tags: [presence]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetPresenceRequest' }
      responses:
        '204': { description: Status set }

  # -- Notifications --------------------------------------------------------
  /api/v1/workspaces/{workspaceID}/notifications:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
    get:
      summary: List notifications for the caller
      tags: [notifications]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }

  /api/v1/workspaces/{workspaceID}/notifications/read-all:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
    post:
      summary: Mark every notification read
      tags: [notifications]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Marked read }

  /api/v1/workspaces/{workspaceID}/notifications/register-token:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
    post:
      summary: Register a push notification token or web push subscription
      tags: [notifications]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationTokenRequest' }
      responses:
        '204': { description: Token registered }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/workspaces/{workspaceID}/notifications/unregister-token:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
    post:
      summary: Unregister a push notification token or web push subscription
      tags: [notifications]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationTokenRequest' }
      responses:
        '204': { description: Token unregistered }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/workspaces/{workspaceID}/notifications/unread-count:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
    get:
      summary: Unread notification count
      tags: [notifications]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnreadCountResponse' }

  /api/v1/workspaces/{workspaceID}/notifications/{notificationID}/read:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - name: notificationID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Mark a single notification read
      tags: [notifications]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Marked read }

  # -- Search ---------------------------------------------------------------
  /api/v1/workspaces/{workspaceID}/search:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
    get:
      summary: Server-side search across messages and channels
      tags: [search]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Search hits
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }

  # -- Invites --------------------------------------------------------------
  /api/v1/workspaces/{workspaceID}/invites:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
    get:
      summary: List active invites in a workspace
      tags: [invites]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Invites
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GuestInvite' }
    post:
      summary: Create a guest invite
      tags: [invites]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInviteRequest' }
      responses:
        '201':
          description: Created invite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestInvite' }

  /api/v1/workspaces/{workspaceID}/invites/{inviteID}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - name: inviteID
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      summary: Revoke an invite
      tags: [invites]
      security: [{ bearerAuth: [] }]
      responses:
