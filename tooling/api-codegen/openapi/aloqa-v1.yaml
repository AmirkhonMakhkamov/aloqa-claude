openapi: 3.0.3
info:
  title: Aloqa Backend API
  version: 2.0.0
  description: |-
    Hand-authored OpenAPI 3.0 spec covering the Aloqa frontend contract consumed by aloqa-frontend. The spec is the source of truth; `tooling/api-codegen` runs `openapi-typescript` against it to emit typed clients.

    Synced from aloqa-frontend origin/pr-sync/ALK-885-files-qa and extended with the aloqa-claude File Manager endpoints.
servers:
  - url: https://airion-cargo.store
    description: Production (Vultr edge → aloqa-claude).
  - url: http://localhost:8080
    description: Local dev backend.
paths:
  /api/v1/auth/register:
    post:
      summary: Register a new user account
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
      security: []
  /api/v1/auth/login:
    post:
      summary: Exchange credentials for an access + refresh token
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security: []
  /api/v1/auth/refresh:
    post:
      summary: Rotate the refresh token and return a new access token
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security: []
  /api/v1/auth/logout:
    post:
      summary: Invalidate a refresh-token session
      tags:
        - auth
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  $ref: '#/components/schemas/UUID'
      responses:
        '204':
          description: Logged out
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Session revocation failed
  /api/v1/auth/logout-all:
    post:
      summary: Invalidate every refresh token for the current user
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        '204':
          description: All sessions invalidated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Session revocation failed
  /api/v1/auth/logout-others:
    post:
      summary: Invalidate every refresh token except the caller's current session
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Other sessions invalidated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Session revocation failed
  /api/v1/auth/sessions:
    get:
      summary: List active sessions for the current user
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthSessionListEntry'
  /api/v1/users/me:
    get:
      summary: Current user profile
      tags:
        - users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      summary: Update display name / locale / avatar
      tags:
        - users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /api/v1/users/me/files:
    get:
      summary: List the caller's workspace file library projection
      tags: [files]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
        - name: q
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [date, name, size], default: date }
        - name: dir
          in: query
          schema: { type: string, enum: [asc, desc] }
        - name: scope
          in: query
          schema: { type: string, enum: [all, mine, shared, favorites], default: all }
        - name: chat_id
          in: query
          schema: { $ref: '#/components/schemas/UUID' }
        - name: category
          in: query
          schema: { type: string, enum: [image, document, archive, video, audio, code] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Cursor-paginated file library page with facets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }


  /api/v1/users/me/storage:
    get:
      summary: Get the caller's file storage usage and upload limits
      tags: [files]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Storage usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileStorageUsage' }
        '401': { $ref: '#/components/responses/Unauthorized' }


  /api/v1/workspaces:
    get:
      summary: List workspaces the user is a member of
      tags:
        - workspaces
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Workspace list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
    post:
      summary: Create a new organization workspace
      tags:
        - workspaces
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Created workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
  /api/v1/workspaces/{workspaceID}:
    parameters:
      - name: workspaceID
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Fetch a single workspace by id
      tags:
        - workspaces
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/personal:
    get:
      summary: Fetch the caller's personal workspace
      tags:
        - workspaces
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Personal workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
  /api/v1/workspaces/{workspaceID}/members:
    parameters:
      - name: workspaceID
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List workspace members (callable by any member)
      tags:
        - workspaces
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceMember'
  /api/v1/workspaces/{workspaceID}/channels:
    parameters:
      - name: workspaceID
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List channels in a workspace
      tags:
        - channels
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Channel'
    post:
      summary: Create a channel in a workspace
      tags:
        - channels
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChannelRequest'
      responses:
        '201':
          description: Created channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
  /api/v1/workspaces/{workspaceID}/channels/dm:
    parameters:
      - name: workspaceID
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Open or fetch a DM channel
      tags:
        - channels
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDmRequest'
      responses:
        '200':
          description: DM channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
  /api/v1/workspaces/{workspaceID}/channels/unread:
    parameters:
      - name: workspaceID
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Per-channel unread counts for the caller
      tags:
        - channels
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unread counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChannelUnreadCount'
  /api/v1/workspaces/{workspaceID}/channels/{channelID}:
    parameters:
      - name: workspaceID
        in: path
        required: true
        schema:
          type: string
      - name: channelID
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Fetch a channel
      tags:
        - channels
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
    put:
      summary: Update a channel (name / topic / archived)
      tags:
        - channels
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChannelRequest'
      responses:
        '200':
          description: Updated channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
  /api/v1/workspaces/{workspaceID}/channels/{channelID}/members:
    parameters:
      - name: workspaceID
        in: path
        required: true
        schema:
          type: string
      - name: channelID
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List channel members
      tags:
        - channels
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Channel members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChannelMember'
    post:
      summary: Add channel members
      tags:
        - channels
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddChannelMembersRequest'
      responses:
        '200':
          description: Added members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChannelMember'
  /api/v1/workspaces/{workspaceID}/channels/{channelID}/members/{userID}:
    parameters:
      - name: workspaceID
        in: path
        required: true
        schema:
          type: string
      - name: channelID
        in: path
        required: true
        schema:
          type: string
      - name: userID
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Remove a channel member
      tags:
        - channels
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Removed member
  /api/v1/workspaces/{workspaceID}/channels/{channelID}/mentions:
    parameters:
      - name: workspaceID
        in: path
        required: true
        schema:
          type: string
      - name: channelID
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List channel mention candidates
      tags:
        - channels
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Channel mention candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChannelMentionSuggestion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/workspaces/{workspaceID}/channels/{channelID}/read:
    parameters:
      - name: workspaceID
        in: path
        required: true
        schema:
          type: string
      - name: channelID
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Mark the channel read at the given message
      tags:
        - channels
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Marked read
  /api/v1/workspaces/{workspaceID}/channels/{channelID}/messages:
    parameters:
      - name: workspaceID
        in: path
        required: true
        schema:
          type: string
      - name: channelID
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List channel messages (paginated)
      tags:
        - messages
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: before
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
    post:
      summary: Send a message to a channel
      tags:
        - messages
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Created message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /api/v1/workspaces/{workspaceID}/channels/{channelID}/messages/{messageID}:
    parameters:
      - name: workspaceID
        in: path
        required: true
        schema:
          type: string
      - name: channelID
        in: path
        required: true
        schema:
          type: string
      - name: messageID
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Edit a message (author only)
      tags:
        - messages
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditMessageRequest'
      responses:
        '200':
          description: Updated message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
    delete:
      summary: Delete a message
      tags:
        - messages
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted message
    get:
      summary: GET /api/v1/workspaces/{workspaceID}/channels/{channelID}/messages/{messageID}
      tags:
        - messages
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/workspaces/{workspaceID}/channels/{channelID}/messages/{messageID}/thread:
    parameters:
      - name: workspaceID
        in: path
        required: true
        schema:
          type: string
      - name: channelID
        in: path
        required: true
        schema:
          type: string
      - name: messageID
        in: path
        required: true
        schema:
          type: string
    get:
      summary: List thread replies for a message
      tags:
        - messages
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thread replies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
  /api/v1/workspaces/{workspaceID}/channels/{channelID}/messages/{messageID}/pin:
    parameters:
      - name: workspaceID
        in: path
        required: true
        schema:
          type: string
      - name: channelID
        in: path
        required: true
        schema:
          type: string
      - name: messageID
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Pin a message
      tags:
        - messages
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Pinned message
    delete:
      summary: Unpin a message
      tags:
        - messages
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Unpinned message
  /api/v1/workspaces/{workspaceID}/channels/{channelID}/messages/{messageID}/reactions:
    parameters:
      - name: workspaceID
        in: path
        required: true
        schema:
          type: string
      - name: channelID
        in: path
        required: true
        schema:
          type: string
      - name: messageID
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Add a reaction to a message
      tags:
        - reactions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddReactionRequest'
      responses:
        '201':
          description: Added reaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reaction'
  /api/v1/workspaces/{workspaceID}/channels/{channelID}/messages/{messageID}/reactions/{emoji}:
    parameters:
      - name: workspaceID
        in: path
        required: true
        schema:
          type: string
      - name: channelID
        in: path
        required: true
        schema:
          type: string
      - name: messageID
        in: path
        required: true
        schema:
          type: string
      - name: emoji
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Remove the caller's reaction matching the emoji
      tags:
        - reactions
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Removed reaction
  /api/v1/files/upload:
    post:
      summary: Upload a file into the caller's Files library
      tags: [files]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                workspace_id:
                  $ref: '#/components/schemas/UUID'
                context_id:
                  description: Workspace id or chat/channel id used to infer workspace.
                  $ref: '#/components/schemas/UUID'
      responses:
        '201':
          description: Created library file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryFile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: User storage quota exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }


  /api/v1/files/{fileID}:
    parameters:
      - $ref: '#/components/parameters/FileID'
    get:
      summary: Create a fresh download or inline-preview URL for a library file
      tags: [files]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: disposition
          in: query
          schema: { type: string, enum: [attachment, inline], default: attachment }
      responses:
        '200':
          description: Fresh file URL envelope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileDownloadURL' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Delete an owned library file and revoke its shares
      tags: [files]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }


  /api/v1/files/{fileID}/favorite:
    parameters:
      - $ref: '#/components/parameters/FileID'
    put:
      summary: Add a library file to the caller's favorites
      tags: [files]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Favorited }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Remove a library file from the caller's favorites
      tags: [files]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Unfavorited }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }


  /api/v1/files/{fileID}/shares:
    parameters:
      - $ref: '#/components/parameters/FileID'
    get:
      summary: List owner-visible file shares
      tags: [files]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: File shares
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileSharesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Share an owned library file to a chat
      tags: [files]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileShareRequest' }
      responses:
        '204': { description: Share upserted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Revoke an owned library file share
      tags: [files]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileShareRequest' }
      responses:
        '204': { description: Share revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
