          nullable: true
        started_at:
          $ref: '#/components/schemas/IsoDatetime'
        channel_id:
          $ref: '#/components/schemas/UUID'
          nullable: true
        host_user_id:
          $ref: '#/components/schemas/UUID'
        participant_count:
          type: integer
        observer_count:
          type: integer
        recording:
          type: boolean
        is_open:
          type: boolean
        channel_name:
          type: string
          nullable: true
        host_display_name:
          type: string
        top_participants:
          type: array
          items:
            $ref: '#/components/schemas/TopParticipant'
    ActiveCallsResponse:
