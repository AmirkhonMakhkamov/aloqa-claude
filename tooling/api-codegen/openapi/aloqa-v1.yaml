    InviteMemberRequest:
      type: object
      required:
        - email
        - role
      properties:
        email:
          type: string
        role:
          type: string
          enum:
            - admin
            - member
            - guest
    WorkspaceRoleDefinition:
      type: object
      required:
        - id
        - workspace_id
        - name
        - base_role
        - permissions
        - system
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        workspace_id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        base_role:
          type: string
          enum:
            - owner
            - admin
            - member
            - guest
        permissions:
          type: array
          items:
            type: string
        system:
          type: boolean
        created_at:
          $ref: '#/components/schemas/IsoDatetime'
        updated_at:
          $ref: '#/components/schemas/IsoDatetime'
    CreateRoleRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        base_role:
          type: string
          enum:
            - owner
            - admin
            - member
            - guest
        permissions:
          type: array
          items:
            type: string
    UpdateRoleRequest:
      type: object
      properties:
        name:
          type: string
        base_role:
          type: string
          enum:
            - owner
            - admin
            - member
            - guest
        permissions:
          type: array
          items:
            type: string
    AuditEntry:
      type: object
      required:
        - id
        - workspace_id
        - action
        - actor_id
        - target_type
        - target_id
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        workspace_id:
          $ref: '#/components/schemas/UUID'
        action:
          type: string
        actor_id:
          $ref: '#/components/schemas/UUID'
        target_type:
          type: string
        target_id:
          type: string
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        created_at:
          $ref: '#/components/schemas/IsoDatetime'
    AuditLogResponse:
      type: object
      required:
        - entries
        - total
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        total:
          type: integer
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - display_name
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
        display_name:
          type: string
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
        device_info:
          type: string
    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
    AuthSessionListEntry:
      type: object
      required:
        - id
        - user_id
        - user_agent
        - is_current
        - created_at
        - last_active_at
      properties:
        id:
          type: string
        user_id:
          type: string
        user_agent:
          type: string
        ip:
          type: string
        is_current:
          type: boolean
        device_label:
          type: string
        browser_label:
          type: string
        os_label:
          type: string
        created_at:
          $ref: '#/components/schemas/IsoDatetime'
        last_active_at:
          $ref: '#/components/schemas/IsoDatetime'
    CallType:
      type: string
      description: Call shape (1:1 vs group/meeting/webinar/selector lobby).
      enum:
        - one_to_one
        - group
        - meeting
        - webinar
        - selector
    CallStatus:
      type: string
      description: Lifecycle state of the call.
      enum:
        - ringing
        - active
        - ended
    CallRole:
      type: string
      description: Participant's role in the call (separate from connection status).
      enum:
        - host
        - co_host
        - presenter
        - participant
        - viewer
    ParticipantStatus:
      type: string
      description: Connection status of a participant inside the call.
      enum:
        - invited
        - waiting
        - joining
        - connected
        - disconnected
        - declined
    CallEndReason:
      type: string
      description: Terminal lifecycle reason for an ended call.
      enum:
        - host_ended
        - all_left
        - failed
        - missed
        - cancelled
    ParticipantLeftReason:
      type: string
      description: Reason a participant was marked disconnected.
      enum:
        - left
        - timeout
        - declined
        - missed
    CallEntryMode:
      type: string
      description: |
        How a non-guest member enters a call (set at creation):
        `manual_admit` holds them in the waiting room until a host admits them,
        `password` requires the join password, `open` lets them join directly.
        Guests (one-time link) always pass through the waiting room and bypass
        the password.
      enum:
        - manual_admit
        - password
        - open
    CallAccessLevel:
      type: string
      description: |
        Call access level. Channel-attached calls derive access from the channel;
        channel-less private calls are visible/joinable only to invited members,
        connected participants, creator, host/co-host, or call-scoped guest grants.
      enum:
        - public
        - private
    WhoCanAddGuestsPolicy:
      type: string
      description: Who can create guest invite links for a call.
      enum:
        - host
        - everyone
    CallSettings:
      type: object
      description: Per-call feature toggles. Mirrors aloqa-claude entity.CallSettings.
      required:
        - waiting_room
        - mute_on_join
        - recording
        - screen_sharing
        - chat
        - breakout_rooms
        - max_participants
        - e2ee
        - watermark
        - entry_mode
        - members_can_unmute_mic
        - members_can_enable_camera
        - breakout_creation
        - max_breakout_rooms
        - who_can_add_guests
      properties:
        waiting_room:
          type: boolean
          description: Hold joiners in a lobby until admitted.
        mute_on_join:
          type: boolean
          description: Force participants to join muted.
        recording:
          type: boolean
          description: Recording is permitted.
        screen_sharing:
          type: boolean
          description: Screen-sharing is permitted.
        chat:
          type: boolean
          description: In-call chat is enabled.
        breakout_rooms:
          type: boolean
          description: Breakout-rooms are enabled.
        max_participants:
          type: integer
          description: Hard cap on simultaneous participants.
        e2ee:
          type: boolean
          description: End-to-end encryption is required.
        watermark:
          type: boolean
          description: Render a per-user watermark on video tiles.
        entry_mode:
          $ref: '#/components/schemas/CallEntryMode'
        members_can_unmute_mic:
          type: boolean
          description: >-
            Meeting-level member permission (ALK-812): whether non host/co-host
            members may unmute their microphone. Defaults to true (permissive).
        members_can_enable_camera:
          type: boolean
          description: >-
            Meeting-level member permission (ALK-812): whether non host/co-host
            members may enable their camera. Defaults to true (permissive).
        breakout_creation:
          type: string
          description: Who may open breakout rooms.
          enum:
            - host
            - everyone
        max_breakout_rooms:
          type: integer
          description: Host-set ceiling on simultaneous breakout rooms.
          minimum: 1
          maximum: 8
        who_can_add_guests:
          $ref: '#/components/schemas/WhoCanAddGuestsPolicy'
    StartCallSettings:
      type: object
      description: Partial call settings accepted by POST /workspaces/{workspaceID}/calls.
      properties:
        waiting_room:
          type: boolean
          description: Hold joiners in a lobby until admitted.
        mute_on_join:
          type: boolean
          description: Force participants to join muted.
        recording:
          type: boolean
          description: Recording is permitted.
        screen_sharing:
          type: boolean
          description: Screen-sharing is permitted.
        chat:
          type: boolean
          description: In-call chat is enabled.
        breakout_rooms:
          type: boolean
          description: Breakout-rooms are enabled.
        max_participants:
          type: integer
          description: Hard cap on simultaneous participants.
        e2ee:
          type: boolean
          description: End-to-end encryption is required.
        watermark:
          type: boolean
          description: Render a per-user watermark on video tiles.
        entry_mode:
          $ref: '#/components/schemas/CallEntryMode'
        password:
          type: string
          maxLength: 72
          writeOnly: true
          description: |
            Join password for password entry mode (write-only, hashed
            server-side, never returned). Required when entry_mode is "password".
        who_can_add_guests:
          $ref: '#/components/schemas/WhoCanAddGuestsPolicy'
    Call:
      type: object
      description: A real-time call. Mirrors aloqa-claude entity.Call.
      required:
        - id
        - workspace_id
        - type
        - status
        - access_level
        - created_by
        - settings
        - created_at
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          description: Unique call identifier.
        workspace_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          description: Workspace that owns the call.
        channel_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          nullable: true
          description: Channel the call is bound to; absent/null for ad-hoc calls.
        type:
          allOf:
            - $ref: '#/components/schemas/CallType'
          description: Call shape selected at creation time.
        status:
          allOf:
            - $ref: '#/components/schemas/CallStatus'
          description: Current lifecycle state.
        access_level:
          allOf:
            - $ref: '#/components/schemas/CallAccessLevel'
          description: Effective call access level.
        title:
          type: string
          nullable: true
          description: Optional human-readable title.
        created_by:
          allOf:
            - $ref: '#/components/schemas/UUID'
          description: User who created the call.
        scheduled_call_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          nullable: true
          description: Calendar event call id when this call was started from a scheduled event.
        settings:
          allOf:
            - $ref: '#/components/schemas/CallSettings'
          description: Feature toggles captured for this call.
        started_at:
          allOf:
            - $ref: '#/components/schemas/IsoDatetime'
          nullable: true
          description: When the call became active; absent/null while still ringing.
        ended_at:
          allOf:
            - $ref: '#/components/schemas/IsoDatetime'
          nullable: true
          description: When the call ended; absent/null while active.
        end_reason:
          allOf:
            - $ref: '#/components/schemas/CallEndReason'
          nullable: true
          description: Why the call ended; absent/null until the first terminal transition wins.
        featured_share_user_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          nullable: true
          description: User whose screen share is currently featured; absent/null when cleared.
        pinned_participant_user_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          nullable: true
          description: Participant currently pinned for everyone; absent/null when cleared.
        created_at:
          allOf:
            - $ref: '#/components/schemas/IsoDatetime'
          description: When the call record was created.
    CallParticipant:
      type: object
      description: A participant in a call. Mirrors aloqa-claude entity.CallParticipant.
      required:
        - id
        - call_id
        - user_id
        - role
        - status
        - audio_muted
        - video_muted
        - screen_sharing
        - can_screen_share
        - is_guest
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          description: Unique participant-row identifier.
        call_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          description: Call this participant belongs to.
        user_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          description: User represented by this participant entry.
        breakout_room_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          nullable: true
          description: Breakout room the participant is currently in; absent/null in main room.
        role:
          allOf:
            - $ref: '#/components/schemas/CallRole'
          description: Participant's permission role in the call.
        status:
          allOf:
            - $ref: '#/components/schemas/ParticipantStatus'
          description: Participant's connection state.
        audio_muted:
          type: boolean
          description: Microphone is muted.
        video_muted:
          type: boolean
          description: Camera is off.
        screen_sharing:
          type: boolean
          description: Participant is sharing their screen.
        joined_at:
          allOf:
            - $ref: '#/components/schemas/IsoDatetime'
          nullable: true
          description: When this participant joined.
        left_at:
          allOf:
            - $ref: '#/components/schemas/IsoDatetime'
          nullable: true
          description: When this participant left; absent/null while connected.
        left_reason:
          allOf:
            - $ref: '#/components/schemas/ParticipantLeftReason'
          nullable: true
          description: Why this participant disconnected; absent/null while connected.
        can_screen_share:
          type: boolean
        display_name:
          type: string
        is_guest:
          type: boolean
    InviteParticipantsRequest:
      type: object
      required:
        - user_ids
      properties:
        user_ids:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
    InviteSkip:
      type: object
      required:
        - user_id
        - reason
      properties:
        user_id:
          $ref: '#/components/schemas/UUID'
        reason:
          type: string
          enum:
            - already_connected
            - joining
            - waiting
            - no_access
    InviteParticipantsResponse:
      type: object
      required:
        - invited
        - skipped
      properties:
        invited:
          type: array
          items:
            $ref: '#/components/schemas/CallParticipant'
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/InviteSkip'
    StartCallRequest:
      type: object
      description: Body for POST /workspaces/{workspaceID}/calls.
      required:
        - type
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/CallType'
          description: Call shape to create.
        access_level:
          allOf:
            - $ref: '#/components/schemas/CallAccessLevel'
          description: Access level for channel-less calls; defaults to public.
        channel_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          nullable: true
          description: Optional channel to bind the call to.
        title:
          type: string
          description: Optional title for the call.
        settings:
          allOf:
            - $ref: '#/components/schemas/StartCallSettings'
          description: Optional feature toggles; omitted fields decode to backend defaults.
        invited_member_ids:
          type: array
          description: Members invited to a private channel-less call at creation.
          items:
            $ref: '#/components/schemas/UUID'
    LiveKitConnection:
      type: object
      description: LiveKit connection metadata returned when LiveKit is configured.
      properties:
        livekit_url:
          type: string
          description: LiveKit websocket URL.
        access_token:
          type: string
          description: LiveKit access token for the current user and call room.
        expires_at:
          allOf:
            - $ref: '#/components/schemas/IsoDatetime'
          description: Backward-compatible token expiration timestamp.
        token_expires_at:
          allOf:
            - $ref: '#/components/schemas/IsoDatetime'
          description: Token expiration timestamp.
        refresh_after:
          allOf:
            - $ref: '#/components/schemas/IsoDatetime'
          description: Earliest suggested token refresh timestamp.
    StartCallResponse:
      allOf:
        - type: object
          required:
            - call
          properties:
            call:
              $ref: '#/components/schemas/Call'
        - $ref: '#/components/schemas/LiveKitConnection'
    JoinCallRequest:
      type: object
      description: |
        Optional join body. Send `password` only when the call's entry_mode is
        "password"; manual_admit/open joins may omit the body entirely.
      properties:
        password:
          type: string
          maxLength: 72
          writeOnly: true
          description: The call's join password (verified server-side).
    JoinCallResponse:
      allOf:
        - type: object
          required:
            - participant
          properties:
            participant:
              $ref: '#/components/schemas/CallParticipant'
        - $ref: '#/components/schemas/LiveKitConnection'
    LeaveCallResponse:
      type: object
      required:
        - already_left
      properties:
        already_left:
          type: boolean
          description: True when the leave request was an idempotent no-op.
    CancelCallResponse:
      type: object
      required:
        - ended
      properties:
        ended:
          type: boolean
          description: True when this request won the ringing-to-cancelled terminal transition.
    UpdateCallMediaRequest:
      type: object
      description: Body for PUT /workspaces/{workspaceID}/calls/{callID}/media.
      properties:
        audio_muted:
          type: boolean
          description: Patch microphone mute state; omitted means leave unchanged.
        video_muted:
          type: boolean
          description: Patch camera mute state; omitted means leave unchanged.
        screen_sharing:
          type: boolean
          description: Patch screen-sharing state; omitted means leave unchanged.
    SetQualityRequest:
      type: object
      required:
        - stream_id
        - quality
      properties:
        stream_id:
          type: string
        quality:
          type: string
          description: 'LiveKit video quality selector: f=high, h=medium, q=low.'
          enum:
            - f
            - h
            - q
    SetFeaturedShareRequest:
      type: object
      required:
        - user_id
      properties:
        user_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          nullable: true
    SetPinnedParticipantRequest:
      type: object
      required:
        - user_id
      properties:
        user_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          nullable: true
    UpdateCallSettingsRequest:
      type: object
      description: |
        Body for PATCH /workspaces/{workspaceID}/calls/{callID}/settings. Partial —
        every field is optional and an omitted field leaves that setting unchanged.
        entry_mode is the single source of truth for the lobby (the backend derives
        waiting_room from it); switching to `password` requires a pre-configured join
        password (set at creation). The member-permission policy fields
        (screen_sharing, chat, members_can_unmute_mic, members_can_enable_camera)
        are host/co-host controlled (ALK-812).
      properties:
        access_level:
          $ref: '#/components/schemas/CallAccessLevel'
        entry_mode:
          $ref: '#/components/schemas/CallEntryMode'
        mute_on_join:
          type: boolean
          description: Patch whether participants join muted; omitted means leave unchanged.
        breakout_rooms:
          type: boolean
          description: Patch breakout-room availability; omitted means leave unchanged.
        screen_sharing:
          type: boolean
          description: Patch whether members may share their screen; omitted means leave unchanged.
        chat:
          type: boolean
          description: Patch whether in-call chat is enabled for members; omitted means leave unchanged.
        members_can_unmute_mic:
          type: boolean
          description: Patch whether members may unmute their mic; omitted means leave unchanged.
        members_can_enable_camera:
          type: boolean
          description: Patch whether members may enable their camera; omitted means leave unchanged.
        who_can_add_guests:
          $ref: '#/components/schemas/WhoCanAddGuestsPolicy'
        breakout_creation:
          type: string
          description: Patch who may open breakout rooms; omitted means leave unchanged.
          enum:
            - host
            - everyone
        max_breakout_rooms:
          type: integer
          description: Patch the simultaneous breakout-room ceiling; omitted means leave unchanged.
          minimum: 1
          maximum: 8
    SendCallMessageRequest:
      type: object
      required:
        - body
      properties:
        body:
          type: string
    AdmitParticipantRequest:
      type: object
      required:
        - user_id
      properties:
        user_id:
          $ref: '#/components/schemas/UUID'
    TransferHostRequest:
      type: object
      required:
        - user_id
      properties:
        user_id:
          $ref: '#/components/schemas/UUID'
    ResolveShareRequest:
      type: object
      required:
        - approved
      properties:
        approved:
          type: boolean
    CallReactionRequest:
      type: object
      required:
        - emoji
      properties:
        emoji:
          type: string
    MoveMessageRequest:
      type: object
      required:
        - channel_id
      properties:
        channel_id:
          $ref: '#/components/schemas/UUID'
        parent_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          nullable: true
    TurnCredentials:
      type: object
      description: Short-lived TURN credentials (per AD-5; 30-minute TTL).
      required:
        - urls
        - username
        - credential
        - ttl
      properties:
        urls:
          type: array
          description: TURN server URLs.
          items:
            type: string
        username:
          type: string
          description: HMAC-derived username.
        credential:
          type: string
          description: HMAC-derived credential.
        ttl:
          type: integer
          description: Time-to-live in seconds.
    MediaSessionToken:
      type: object
      description: Per-call SFU session token. Mirrors aloqa-claude frontend API shape.
      required:
        - token
        - role
        - expires_at
      properties:
        token:
          type: string
          description: Opaque session token used by media-session offer and ICE endpoints.
        role:
          type: string
          description: Whether this participant is allowed to publish media.
          enum:
            - presenter
            - viewer
        expires_at:
          allOf:
            - $ref: '#/components/schemas/IsoDatetime'
          description: Expiration timestamp for the media token.
        node_id:
          type: string
          description: SFU node identifier.
        region:
          type: string
          nullable: true
          description: SFU region (for example, eu-west-1).
        control_url:
          type: string
          nullable: true
          description: SFU control-plane endpoint.
        media_url:
          type: string
          nullable: true
          description: SFU media-plane endpoint.
        routing_mode:
          type: string
          nullable: true
          description: SFU routing mode.
        fanout_strategy:
          type: string
          nullable: true
          description: Outbound stream fanout strategy.
        overflow_policy:
          type: string
          nullable: true
          description: Behaviour when capacity is reached.
        screen_share_priority:
          type: string
          nullable: true
          description: Screen-share QoS priority.
        turn_strategy:
          type: string
          nullable: true
          description: Client-side TURN preference relayed by the SFU.
          enum:
            - stun_only
            - stun_first
            - turn_first
            - turn_only
            - regional_turn_pool
    SdpOffer:
      type: object
