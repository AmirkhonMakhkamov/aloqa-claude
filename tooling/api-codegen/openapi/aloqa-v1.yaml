        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/workspaces/{workspaceID}/calls/{callID}/participants/{userID}/revoke-screen-share:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/CallID'
      - name: userID
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Revoke a participant's screen-share grant (host/co-host)
      tags: [calls]
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Screen-share grant revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/workspaces/{workspaceID}/calls/{callID}/featured-share:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/CallID'
    put:
      summary: Feature one participant's screen-share for everyone (host/co-host)
      tags: [calls]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetFeaturedShareRequest' }
      responses:
        '204': { description: Featured share updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # The /turn-credentials path was originally vendored straight into
  # _generated.ts (commit 5fef4db) without a corresponding YAML entry; re-add
  # the spec block so the codegen regen preserves the typed path consumed by
  # webrtc/engine.ts and exercised by api/__tests__/calls.test.ts.
  /api/v1/workspaces/{workspaceID}/calls/{callID}/turn-credentials:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/CallID'
    post:
      summary: Fetch short-lived TURN credentials for the call
      tags: [calls]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: TURN URLs and ephemeral credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TurnCredentials' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/workspaces/{workspaceID}/calls/{callID}/media-session/token:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/CallID'
    post:
      summary: Mint an SFU per-call session token (engine-internal)
      tags: [calls]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Session token and SFU routing metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaSessionToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/workspaces/{workspaceID}/calls/{callID}/media-session/offer:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/CallID'
    post:
      summary: Exchange SDP offer for SDP answer (engine-internal)
      tags: [calls]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaSessionOfferRequest' }
      responses:
        '200':
          description: SFU SDP answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SdpAnswer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/workspaces/{workspaceID}/calls/{callID}/media-session/ice-candidate:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/CallID'
    post:
      summary: Trickle a local ICE candidate to the SFU (engine-internal)
      tags: [calls]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MediaSessionIceCandidateRequest' }
      responses:
        '204': { description: Candidate accepted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

# ---------------------------------------------------------------------------
# Reusable parameters / responses
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    WorkspaceID:
      name: workspaceID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChannelID:
      name: channelID
      in: path
      required: true
      schema: { type: string, format: uuid }
    MessageID:
      name: messageID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReactionID:
      name: reactionID
      in: path
      required: true
      schema: { type: string, format: uuid }
    CallID:
      name: callID
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Authentication required or refresh token rejected
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Caller lacks permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Resource already exists or precondition failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  # -- Schemas --------------------------------------------------------------
  schemas:
    UUID: { type: string, format: uuid }
    IsoDatetime: { type: string, format: date-time }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }

    User:
      type: object
      required: [id, email, display_name, avatar_color, status, locale, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        email: { type: string }
        display_name: { type: string }
        avatar_url: { type: string, nullable: true }
        avatar_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        position: { type: string, nullable: true }
        department: { type: string, nullable: true }
        status:
          type: string
          enum: [active, suspended, deactivated]
        locale: { type: string }
        created_at: { $ref: '#/components/schemas/IsoDatetime' }
        updated_at: { $ref: '#/components/schemas/IsoDatetime' }

    UpdateUserRequest:
      type: object
      properties:
        display_name: { type: string }
        avatar_url: { type: string, nullable: true }
        locale: { type: string }

    Workspace:
      type: object
      required: [id, name, kind, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        name: { type: string }
        slug: { type: string }
        kind:
          type: string
          enum: [personal, organization]
        owner_id: { $ref: '#/components/schemas/UUID' }
        created_at: { $ref: '#/components/schemas/IsoDatetime' }
        updated_at: { $ref: '#/components/schemas/IsoDatetime' }

    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string }

    Channel:
      type: object
      required: [id, workspace_id, name, type, created_by, archived, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        workspace_id: { $ref: '#/components/schemas/UUID' }
        name: { type: string }
        topic: { type: string, nullable: true }
        type:
          type: string
          enum: [public, private, dm, group_dm]
        created_by: { $ref: '#/components/schemas/UUID' }
        archived: { type: boolean }
        created_at: { $ref: '#/components/schemas/IsoDatetime' }
        updated_at: { $ref: '#/components/schemas/IsoDatetime' }
        # Populated only for `type` in (dm, group_dm) so the client can render
        # the counterpart user without an extra round-trip per row. Backend
        # leaves the field unset for public/private channels.
        members:
          type: array
          items: { $ref: '#/components/schemas/UUID' }

    CreateChannelRequest:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1 }
        members:
          type: array
          items: { $ref: '#/components/schemas/UUID' }
        topic: { type: string }
        type:
          type: string
          enum: [public, private]

    ChannelMember:
      type: object
      required: [id, channel_id, user_id, role, last_read_at, joined_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        channel_id: { $ref: '#/components/schemas/UUID' }
        user_id: { $ref: '#/components/schemas/UUID' }
        role:
          type: string
          enum: [owner, admin, member]
        muted_until: { $ref: '#/components/schemas/IsoDatetime', nullable: true }
        last_read_at: { $ref: '#/components/schemas/IsoDatetime' }
        joined_at: { $ref: '#/components/schemas/IsoDatetime' }

    AddChannelMembersRequest:
      type: object
      required: [user_ids]
      properties:
        user_ids:
          type: array
          items: { $ref: '#/components/schemas/UUID' }

    UpdateChannelRequest:
      type: object
      properties:
        name: { type: string }
        topic: { type: string, nullable: true }
        archived: { type: boolean }

    CreateDmRequest:
      type: object
      required: [user_ids]
      properties:
        user_ids:
          type: array
          items: { $ref: '#/components/schemas/UUID' }

    ChannelUnreadCount:
      type: object
      required: [channel_id, unread_count]
      properties:
        channel_id: { $ref: '#/components/schemas/UUID' }
        unread_count: { type: integer }
        last_read_at: { $ref: '#/components/schemas/IsoDatetime' }

    MarkReadRequest:
      type: object
      required: [last_read_message_id]
      properties:
        last_read_message_id: { $ref: '#/components/schemas/UUID' }

    Message:
      type: object
      required: [id, channel_id, user_id, content, type, edited, pinned, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        channel_id: { $ref: '#/components/schemas/UUID' }
        user_id: { $ref: '#/components/schemas/UUID' }
        parent_id: { $ref: '#/components/schemas/UUID', nullable: true }
        content: { type: string }
        type:
          type: string
          enum: [text, system, file]
        edited: { type: boolean }
        edited_at: { $ref: '#/components/schemas/IsoDatetime', nullable: true }
        pinned: { type: boolean }
        pinned_by: { $ref: '#/components/schemas/UUID', nullable: true }
        pinned_at: { $ref: '#/components/schemas/IsoDatetime', nullable: true }
        created_at: { $ref: '#/components/schemas/IsoDatetime' }
        updated_at: { $ref: '#/components/schemas/IsoDatetime' }
        deleted_at: { $ref: '#/components/schemas/IsoDatetime', nullable: true }
        forwarded_from:
          allOf:
            - $ref: '#/components/schemas/ForwardedFromMeta'
          nullable: true
        profile_share:
          description: Server-built internal user profile card payload.
          allOf:
            - $ref: '#/components/schemas/ProfileShare'
          nullable: true
        reply_count: { type: integer, nullable: true }
        reactions:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/Reaction' }
        attachments:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/Attachment' }
        user:
          allOf:
            - $ref: '#/components/schemas/User'
          nullable: true

    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: Empty string is allowed when `forwarded_from` or `profile_share` is present.
        type:
          type: string
          enum: [text, file]
        parent_id: { $ref: '#/components/schemas/UUID' }
        forwarded_from:
          allOf:
            - $ref: '#/components/schemas/ForwardedFromMeta'
          nullable: true
        profile_share:
          description: Send a workspace member profile card in a DM. The server builds the snapshot; clients send only the target user id.
          allOf:
            - $ref: '#/components/schemas/ProfileShareRequest'
          nullable: true

    ProfileShareRequest:
      type: object
      description: Client request to share an active workspace member profile.
      required: [user_id]
      properties:
        user_id:
          description: Target user whose profile should be shared.
          $ref: '#/components/schemas/UUID'

    ProfileShare:
      type: object
      description: Persisted internal profile-share payload. Snapshot fields are captured at send time.
      required: [user_id, workspace_id, snapshot]
      properties:
        user_id:
          $ref: '#/components/schemas/UUID'
        workspace_id:
          $ref: '#/components/schemas/UUID'
        snapshot:
          $ref: '#/components/schemas/ProfileShareSnapshot'

    ProfileShareSnapshot:
      type: object
      description: Backend-generated profile details rendered by clients as a profile card.
      required: [display_name, avatar_color, role]
      properties:
        display_name: { type: string }
        avatar_url: { type: string, nullable: true }
        avatar_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        role:
          type: string
          enum: [owner, admin, member, guest]
        position: { type: string, nullable: true }
        department: { type: string, nullable: true }

    ForwardedFromMeta:
      type: object
      required: [user_id, message_id, channel_id, created_at, snapshot]
      properties:
        user_id: { $ref: '#/components/schemas/UUID' }
        message_id: { $ref: '#/components/schemas/UUID' }
        channel_id: { $ref: '#/components/schemas/UUID' }
        created_at: { $ref: '#/components/schemas/IsoDatetime' }
        snapshot:
          $ref: '#/components/schemas/ForwardedSnapshot'

    ForwardedSnapshot:
      type: object
      required: [content]
      properties:
        content: { type: string }
        attachments:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/Attachment' }

    EditMessageRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1 }

    MoveMessageRequest:
      type: object
      required: [channel_id]
      properties:
        channel_id: { $ref: '#/components/schemas/UUID' }
        parent_id: { $ref: '#/components/schemas/UUID' }

    Reaction:
      type: object
      required: [id, message_id, user_id, emoji, created_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        message_id: { $ref: '#/components/schemas/UUID' }
        user_id: { $ref: '#/components/schemas/UUID' }
        emoji: { type: string }
        created_at: { $ref: '#/components/schemas/IsoDatetime' }

    AddReactionRequest:
      type: object
      required: [emoji]
      properties:
        emoji: { type: string, minLength: 1 }

    Attachment:
      type: object
      required: [id, message_id, file_name, file_size, mime_type, created_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        message_id: { $ref: '#/components/schemas/UUID' }
        file_name: { type: string }
        file_size: { type: integer }
        mime_type: { type: string }
        url: { type: string, nullable: true }
        created_at: { $ref: '#/components/schemas/IsoDatetime' }

    PresenceEntry:
      type: object
      required: [user_id, status, last_seen_at]
      properties:
        user_id: { $ref: '#/components/schemas/UUID' }
        status:
          type: string
          enum: [online, away, dnd, offline]
        last_seen_at: { $ref: '#/components/schemas/IsoDatetime' }

    SetPresenceRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [online, away, dnd, offline]

    Notification:
      type: object
      required: [id, user_id, kind, payload, read, created_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        user_id: { $ref: '#/components/schemas/UUID' }
        kind: { type: string }
        payload:
          type: object
          additionalProperties: true
        read: { type: boolean }
        created_at: { $ref: '#/components/schemas/IsoDatetime' }

    UnreadCountResponse:
      type: object
      required: [unread_count]
      properties:
        unread_count: { type: integer }

    WebPushSubscription:
      type: object
      required: [endpoint]
      properties:
        endpoint: { type: string }
        expirationTime:
          type: integer
          nullable: true
        keys:
          type: object
          additionalProperties:
            type: string

    NotificationTokenRequest:
      type: object
      required: [platform]
      properties:
        platform:
          type: string
          enum: [web_push, apns, fcm]
        token:
          type: string
        web_subscription: { $ref: '#/components/schemas/WebPushSubscription' }

    SearchResponse:
      type: object
      required: [hits]
      properties:
        hits:
          type: array
          items: { $ref: '#/components/schemas/SearchHit' }
        total: { type: integer }

    SearchHit:
      type: object
      required: [kind, id, score]
      properties:
        kind:
          type: string
          enum: [message, channel, user]
        id: { $ref: '#/components/schemas/UUID' }
        score: { type: number }
        snippet: { type: string, nullable: true }
        message:
          allOf:
            - $ref: '#/components/schemas/Message'
          nullable: true
        channel:
          allOf:
            - $ref: '#/components/schemas/Channel'
          nullable: true

    GuestInvite:
      type: object
      required: [id, workspace_id, channel_id, status, token, created_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        workspace_id: { $ref: '#/components/schemas/UUID' }
        channel_id: { $ref: '#/components/schemas/UUID' }
        invited_by: { $ref: '#/components/schemas/UUID' }
        status:
          type: string
          enum: [pending, accepted, revoked, expired]
        token: { type: string }
        expires_at: { $ref: '#/components/schemas/IsoDatetime', nullable: true }
        created_at: { $ref: '#/components/schemas/IsoDatetime' }

    CreateInviteRequest:
      type: object
      required: [channel_id]
      properties:
        channel_id: { $ref: '#/components/schemas/UUID' }
        email: { type: string }
        expires_at: { $ref: '#/components/schemas/IsoDatetime' }

    RedeemInviteRequest:
      type: object
      required: [display_name]
      properties:
        display_name: { type: string, minLength: 1 }

    WorkspaceMember:
      type: object
      required: [id, workspace_id, user_id, role, joined_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        workspace_id: { $ref: '#/components/schemas/UUID' }
        user_id: { $ref: '#/components/schemas/UUID' }
        role:
          type: string
          enum: [owner, admin, member, guest]
        joined_at: { $ref: '#/components/schemas/IsoDatetime' }
        user:
          allOf:
            - $ref: '#/components/schemas/User'
          nullable: true

    InviteMemberRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string }
        role:
          type: string
          enum: [admin, member, guest]

    WorkspaceRoleDefinition:
      type: object
      required: [id, workspace_id, name, permissions, created_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        workspace_id: { $ref: '#/components/schemas/UUID' }
        name: { type: string }
        permissions:
          type: array
          items: { type: string }
        created_at: { $ref: '#/components/schemas/IsoDatetime' }

    CreateRoleRequest:
      type: object
      required: [name, permissions]
      properties:
        name: { type: string, minLength: 1 }
        permissions:
          type: array
          items: { type: string }

    UpdateRoleRequest:
      type: object
      properties:
        name: { type: string }
        permissions:
          type: array
          items: { type: string }

    AuditEntry:
      type: object
      required: [id, workspace_id, action, actor_id, target_type, target_id, created_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        workspace_id: { $ref: '#/components/schemas/UUID' }
        action: { type: string }
        actor_id: { $ref: '#/components/schemas/UUID' }
        target_type: { type: string }
        target_id: { type: string }
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        created_at: { $ref: '#/components/schemas/IsoDatetime' }

    # -- Auth --------------------------------------------------------------
    RegisterRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email: { type: string }
        password: { type: string, minLength: 8 }
        display_name: { type: string }
        locale: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    AuthSession:
      type: object
      required: [user, access_token, refresh_token, expires_at]
      properties:
        user: { $ref: '#/components/schemas/User' }
        access_token: { type: string }
        refresh_token: { type: string }
        expires_at: { $ref: '#/components/schemas/IsoDatetime' }

    AuthSessionListEntry:
      type: object
      required: [id, user_agent, created_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        user_agent: { type: string }
        ip: { type: string, nullable: true }
        is_current: { type: boolean }
        device_label: { type: string, nullable: false }
        browser_label: { type: string, nullable: false }
        os_label: { type: string, nullable: false }
        created_at: { $ref: '#/components/schemas/IsoDatetime' }
        last_active_at: { $ref: '#/components/schemas/IsoDatetime' }

    # -- Calls (AD-9) ------------------------------------------------------
    CallType:
      type: string
      description: Call shape (1:1 vs group/meeting/webinar/selector lobby).
      enum: [one_to_one, group, meeting, webinar, selector]

    CallStatus:
      type: string
      description: Lifecycle state of the call.
      enum: [ringing, active, ended]

    CallRole:
      type: string
      description: Participant's role in the call (separate from connection status).
      enum: [host, co_host, presenter, participant, viewer]

    ParticipantStatus:
      type: string
      description: Connection status of a participant inside the call.
      enum: [invited, waiting, joining, connected, disconnected]

    CallEndReason:
      type: string
      description: Terminal lifecycle reason for an ended call.
      enum: [host_ended, all_left, failed, missed, cancelled]

    ParticipantLeftReason:
      type: string
      description: Reason a participant was marked disconnected.
      enum: [left, timeout, declined, missed]

    CallSettings:
      type: object
      description: Per-call feature toggles. Mirrors aloqa-claude entity.CallSettings.
      required:
        [
          waiting_room,
          mute_on_join,
          recording,
          screen_sharing,
          chat,
          breakout_rooms,
          max_participants,
          e2ee,
          watermark,
        ]
      properties:
        waiting_room:
          type: boolean
          description: Hold joiners in a lobby until admitted.
        mute_on_join:
          type: boolean
          description: Force participants to join muted.
        recording:
          type: boolean
          description: Recording is permitted.
        screen_sharing:
          type: boolean
          description: Screen-sharing is permitted.
        chat:
          type: boolean
          description: In-call chat is enabled.
        breakout_rooms:
          type: boolean
          description: Breakout-rooms are enabled.
        max_participants:
          type: integer
          description: Hard cap on simultaneous participants.
        e2ee:
          type: boolean
          description: End-to-end encryption is required.
        watermark:
          type: boolean
          description: Render a per-user watermark on video tiles.

    StartCallSettings:
      type: object
      description: Partial call settings accepted by POST /workspaces/{workspaceID}/calls.
      properties:
        waiting_room:
          type: boolean
          description: Hold joiners in a lobby until admitted.
        mute_on_join:
          type: boolean
          description: Force participants to join muted.
        recording:
          type: boolean
          description: Recording is permitted.
        screen_sharing:
          type: boolean
          description: Screen-sharing is permitted.
        chat:
          type: boolean
          description: In-call chat is enabled.
        breakout_rooms:
          type: boolean
          description: Breakout-rooms are enabled.
        max_participants:
          type: integer
          description: Hard cap on simultaneous participants.
        e2ee:
          type: boolean
          description: End-to-end encryption is required.
        watermark:
          type: boolean
          description: Render a per-user watermark on video tiles.

    Call:
      type: object
      description: A real-time call. Mirrors aloqa-claude entity.Call.
      required: [id, workspace_id, type, status, created_by, settings, created_at]
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          description: Unique call identifier.
        workspace_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          description: Workspace that owns the call.
        channel_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          nullable: true
          description: Channel the call is bound to; absent/null for ad-hoc calls.
        type:
          allOf:
            - $ref: '#/components/schemas/CallType'
          description: Call shape selected at creation time.
        status:
          allOf:
            - $ref: '#/components/schemas/CallStatus'
          description: Current lifecycle state.
        title:
          type: string
          nullable: true
          description: Optional human-readable title.
        created_by:
          allOf:
            - $ref: '#/components/schemas/UUID'
          description: User who created the call.
        settings:
          allOf:
            - $ref: '#/components/schemas/CallSettings'
          description: Feature toggles captured for this call.
        started_at:
          allOf:
            - $ref: '#/components/schemas/IsoDatetime'
          nullable: true
          description: When the call became active; absent/null while still ringing.
        ended_at:
          allOf:
            - $ref: '#/components/schemas/IsoDatetime'
          nullable: true
          description: When the call ended; absent/null while active.
        end_reason:
          allOf:
            - $ref: '#/components/schemas/CallEndReason'
          nullable: true
          description: Why the call ended; absent/null until the first terminal transition wins.
        featured_share_user_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          nullable: true
          description: User whose screen-share the host featured for everyone; absent/null when none. (ALK-697)
        created_at:
          allOf:
            - $ref: '#/components/schemas/IsoDatetime'
          description: When the call record was created.

    CallParticipant:
      type: object
      description: A participant in a call. Mirrors aloqa-claude entity.CallParticipant.
      required: [id, call_id, user_id, role, status, audio_muted, video_muted, screen_sharing]
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          description: Unique participant-row identifier.
        call_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          description: Call this participant belongs to.
        user_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          description: User represented by this participant entry.
        breakout_room_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          nullable: true
          description: Breakout room the participant is currently in; absent/null in main room.
        role:
          allOf:
            - $ref: '#/components/schemas/CallRole'
          description: Participant's permission role in the call.
        status:
          allOf:
            - $ref: '#/components/schemas/ParticipantStatus'
          description: Participant's connection state.
        audio_muted:
          type: boolean
          description: Microphone is muted.
        video_muted:
          type: boolean
          description: Camera is off.
        screen_sharing:
          type: boolean
          description: Participant is sharing their screen.
        can_screen_share:
          type: boolean
          description: Participant has an explicit grant to publish a screen-share track. (ALK-697)
        joined_at:
          allOf:
            - $ref: '#/components/schemas/IsoDatetime'
          nullable: true
          description: When this participant joined.
        left_at:
          allOf:
            - $ref: '#/components/schemas/IsoDatetime'
          nullable: true
          description: When this participant left; absent/null while connected.
        left_reason:
          allOf:
            - $ref: '#/components/schemas/ParticipantLeftReason'
          nullable: true
          description: Why this participant disconnected; absent/null while connected.

    StartCallRequest:
      type: object
      description: Body for POST /workspaces/{workspaceID}/calls.
      required: [type]
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/CallType'
          description: Call shape to create.
        channel_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          nullable: true
          description: Optional channel to bind the call to.
        title:
          type: string
          description: Optional title for the call.
        settings:
          allOf:
            - $ref: '#/components/schemas/StartCallSettings'
          description: Optional feature toggles; omitted fields decode to backend defaults.

    LiveKitConnection:
      type: object
      description: LiveKit connection metadata returned when LiveKit is configured.
      properties:
        livekit_url:
          type: string
          description: LiveKit websocket URL.
        access_token:
          type: string
          description: LiveKit access token for the current user and call room.
        expires_at:
          allOf:
            - $ref: '#/components/schemas/IsoDatetime'
          description: Backward-compatible token expiration timestamp.
        token_expires_at:
          allOf:
            - $ref: '#/components/schemas/IsoDatetime'
          description: Token expiration timestamp.
        refresh_after:
          allOf:
            - $ref: '#/components/schemas/IsoDatetime'
          description: Earliest suggested token refresh timestamp.

    StartCallResponse:
      allOf:
        - type: object
          required: [call]
          properties:
            call: { $ref: '#/components/schemas/Call' }
        - $ref: '#/components/schemas/LiveKitConnection'

    JoinCallResponse:
      allOf:
        - type: object
          required: [participant]
          properties:
            participant: { $ref: '#/components/schemas/CallParticipant' }
        - $ref: '#/components/schemas/LiveKitConnection'

    LeaveCallResponse:
      type: object
      required: [already_left]
      properties:
        already_left:
          type: boolean
          description: True when the leave request was an idempotent no-op.

    CancelCallResponse:
      type: object
      required: [ended]
      properties:
        ended:
          type: boolean
          description: True when this request won the ringing-to-cancelled terminal transition.

    UpdateCallMediaRequest:
      type: object
      description: Body for PUT /workspaces/{workspaceID}/calls/{callID}/media.
      properties:
        audio_muted:
          type: boolean
          description: Patch microphone mute state; omitted means leave unchanged.
        video_muted:
          type: boolean
          description: Patch camera mute state; omitted means leave unchanged.
        screen_sharing:
          type: boolean
          description: Patch screen-sharing state; omitted means leave unchanged.

    ResolveShareRequest:
      type: object
      description: Body for POST /calls/{callID}/share-requests/{requesterUserID}/resolve. (ALK-697)
      required: [approved]
      properties:
        approved:
          type: boolean
          description: Whether the host grants (true) or denies (false) the screen-share request.

    SetFeaturedShareRequest:
      type: object
      description: Body for PUT /calls/{callID}/featured-share; a null user_id clears the featured share. (ALK-697)
      properties:
        user_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          nullable: true
          description: Participant whose screen-share to feature for everyone; null clears it.

    TurnCredentials:
      type: object
      description: Short-lived TURN credentials (per AD-5; 30-minute TTL).
      required: [urls, username, credential, ttl]
      properties:
        urls:
          type: array
          description: TURN server URLs.
          items: { type: string }
        username:
          type: string
          description: HMAC-derived username.
        credential:
          type: string
          description: HMAC-derived credential.
        ttl:
          type: integer
          description: Time-to-live in seconds.

    MediaSessionToken:
      type: object
      description: Per-call SFU session token. Mirrors aloqa-claude frontend API shape.
      required: [token, role, expires_at]
      properties:
        token:
          type: string
          description: Opaque session token used by media-session offer and ICE endpoints.
        role:
          type: string
          description: Whether this participant is allowed to publish media.
          enum: [presenter, viewer]
        expires_at:
          allOf:
            - $ref: '#/components/schemas/IsoDatetime'
          description: Expiration timestamp for the media token.
        node_id:
          type: string
          description: SFU node identifier.
        region:
          type: string
          nullable: true
          description: SFU region (for example, eu-west-1).
        control_url:
          type: string
          nullable: true
          description: SFU control-plane endpoint.
        media_url:
          type: string
          nullable: true
          description: SFU media-plane endpoint.
        routing_mode:
          type: string
          nullable: true
          description: SFU routing mode.
        fanout_strategy:
          type: string
          nullable: true
          description: Outbound stream fanout strategy.
        overflow_policy:
          type: string
          nullable: true
          description: Behaviour when capacity is reached.
        screen_share_priority:
          type: string
          nullable: true
          description: Screen-share QoS priority.
        turn_strategy:
          type: string
          nullable: true
          description: Client-side TURN preference relayed by the SFU.
          enum: [stun_only, stun_first, turn_first, turn_only, regional_turn_pool]

    SdpOffer:
      type: object
      description: WebRTC SDP offer (RFC 8829).
      required: [type, sdp]
      properties:
        type:
          type: string
          description: SDP message kind.
          enum: [offer]
        sdp:
          type: string
          description: SDP payload.

    SdpAnswer:
      type: object
      description: WebRTC SDP answer (RFC 8829).
      required: [type, sdp]
      properties:
        type:
          type: string
          description: SDP message kind.
          enum: [answer]
        sdp:
          type: string
          description: SDP payload.

    IceCandidate:
      type: object
      description: WebRTC ICE candidate (RFC 8839). Backend DTOs tag SDP metadata with omitempty.
      required: [candidate]
      properties:
        candidate:
          type: string
          description: Candidate attribute line.
        sdp_mid:
          type: string
          nullable: true
          description: Media stream identification for the candidate; omitted when absent.
        sdp_mline_index:
          type: integer
          nullable: true
          description: Media-line index for the candidate; omitted when absent.

    MediaSessionOfferRequest:
      type: object
      description: Body for POST /calls/{callID}/media-session/offer.
      required: [token, sdp]
      properties:
        token:
          type: string
          description: Media-session token minted by the token endpoint.
        sdp:
          type: string
          description: Local offer SDP.
        type:
          type: string
          description: SDP message kind when supplied by legacy clients.
          enum: [offer]

    MediaSessionIceCandidateRequest:
      type: object
      description: Body for POST /calls/{callID}/media-session/ice-candidate.
      required: [token, candidate]
      properties:
        token:
          type: string
          description: Media-session token minted by the token endpoint.
        candidate:
          type: string
          description: Candidate attribute line.
        sdp_mid:
          type: string
          nullable: true
          description: Media stream identification for the candidate; omitted when absent.
        sdp_mline_index:
          type: integer
          nullable: true
          description: Media-line index for the candidate; omitted when absent.
