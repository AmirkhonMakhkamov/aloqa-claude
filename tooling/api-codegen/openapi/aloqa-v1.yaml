components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshTokenCookie:
      type: apiKey
      in: cookie
      name: aloqa_refresh
    sessionIdCookie:
      type: apiKey
      in: cookie
      name: aloqa_session
  parameters:
    FileID:
      name: fileID
      in: path
      required: true
      schema: { type: string, format: uuid }

    WorkspaceID:
      name: workspaceID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChannelID:
      name: channelID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MessageID:
      name: messageID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CallID:
      name: callID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Authentication required or refresh token rejected
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Caller lacks permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Resource already exists or precondition failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: Request is well-formed but cannot be applied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    UUID:
      type: string
      format: uuid
    IsoDatetime:
      type: string
      format: date-time
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
    User:
      type: object
      required:
        - id
        - email
        - display_name
        - position
        - department
        - phone
        - timezone
        - status
        - saved_messages_mode
        - locale
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        email:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
        position:
          type: string
          nullable: true
        department:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - active
            - suspended
            - deactivated
        deactivated_at:
          allOf:
            - $ref: '#/components/schemas/IsoDatetime'
          nullable: true
        saved_messages_mode:
          type: string
          enum:
            - per_workspace
            - global
        locale:
          type: string
        created_at:
          $ref: '#/components/schemas/IsoDatetime'
        updated_at:
          $ref: '#/components/schemas/IsoDatetime'
    UpdateUserRequest:
      type: object
      properties:
        display_name:
          type: string
        avatar_url:
          type: string
          nullable: true
        position:
          type: string
          nullable: true
        department:
          type: string
          nullable: true
        locale:
          type: string
    Workspace:
      type: object
      required:
        - id
        - name
        - slug
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        slug:
          type: string
        kind:
          type: string
          enum:
            - personal
            - organization
        avatar_url:
          type: string
        created_by:
          $ref: '#/components/schemas/UUID'
        created_at:
          $ref: '#/components/schemas/IsoDatetime'
        updated_at:
          $ref: '#/components/schemas/IsoDatetime'
    CreateWorkspaceRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
        avatar_url:
          type: string
    Channel:
      type: object
      required:
        - id
        - workspace_id
        - name
        - type
        - created_by
        - archived
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        workspace_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          nullable: true
        name:
          type: string
        topic:
          type: string
          nullable: true
        type:
          type: string
          enum:
            - public
            - private
            - dm
            - group_dm
            - saved
            - saved_global
        created_by:
          $ref: '#/components/schemas/UUID'
        owner_user_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          nullable: true
        archived:
          type: boolean
        created_at:
          $ref: '#/components/schemas/IsoDatetime'
        updated_at:
          $ref: '#/components/schemas/IsoDatetime'
        last_activity_at:
          allOf:
            - $ref: '#/components/schemas/IsoDatetime'
          nullable: true
        members:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
    CreateChannelRequest:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          minLength: 1
        members:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
        topic:
          type: string
        type:
          type: string
          enum:
            - public
            - private
    ChannelMember:
      type: object
      required:
        - id
        - channel_id
        - user_id
        - role
        - last_read_at
        - joined_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        channel_id:
          $ref: '#/components/schemas/UUID'
        user_id:
          $ref: '#/components/schemas/UUID'
        role:
          type: string
          enum:
            - owner
            - admin
            - member
        muted_until:
          $ref: '#/components/schemas/IsoDatetime'
          nullable: true
        last_read_at:
          $ref: '#/components/schemas/IsoDatetime'
        joined_at:
          $ref: '#/components/schemas/IsoDatetime'
    AddChannelMembersRequest:
      type: object
      required:
        - user_ids
      properties:
        user_ids:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
    ChannelMentionSuggestion:
      type: object
      required:
        - id
        - username
        - display_name
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        username:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
          nullable: true
        position:
          type: string
          nullable: true
    UpdateChannelRequest:
      type: object
      properties:
        name:
          type: string
        topic:
          type: string
        archived:
          type: boolean
    CreateDmRequest:
      type: object
      properties:
        user_id:
          $ref: '#/components/schemas/UUID'
        user_ids:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
        target_workspace_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          nullable: true
    ChannelUnreadCount:
      type: object
      required:
        - channel_id
        - unread_count
      properties:
        channel_id:
          $ref: '#/components/schemas/UUID'
        unread_count:
          type: integer
        last_read_at:
          $ref: '#/components/schemas/IsoDatetime'
    MarkReadRequest:
      type: object
      required:
        - last_read_message_id
      properties:
        last_read_message_id:
          $ref: '#/components/schemas/UUID'
    Message:
      type: object
      required:
        - id
        - channel_id
        - user_id
        - content
        - type
        - edited
        - pinned
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        channel_id:
          $ref: '#/components/schemas/UUID'
        user_id:
          $ref: '#/components/schemas/UUID'
        parent_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          nullable: true
        content:
          type: string
        type:
          type: string
          enum:
            - text
            - system
            - file
        edited:
          type: boolean
        edited_at:
          allOf:
            - $ref: '#/components/schemas/IsoDatetime'
          nullable: true
        pinned:
          type: boolean
        pinned_by:
          allOf:
            - $ref: '#/components/schemas/UUID'
          nullable: true
        pinned_at:
          allOf:
            - $ref: '#/components/schemas/IsoDatetime'
          nullable: true
        forwarded_from:
          type: object
          additionalProperties: true
          nullable: true
        saved_from:
          type: object
          additionalProperties: true
          nullable: true
        quoted_message_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          nullable: true
        quoted_snapshot:
          allOf:
            - $ref: '#/components/schemas/QuotedSnapshot'
          nullable: true
        created_at:
          $ref: '#/components/schemas/IsoDatetime'
        updated_at:
          $ref: '#/components/schemas/IsoDatetime'
        deleted_at:
          allOf:
            - $ref: '#/components/schemas/IsoDatetime'
          nullable: true
        reply_count:
          type: integer
        reactions:
          type: array
          items:
            $ref: '#/components/schemas/Reaction'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        file_ids:
          description: Ordered library file references carried by the message.
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/UUID'
        files:
          description: Ordered resolved library files or tombstones for `file_ids`.
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/MessageFile'
        user:
          allOf:
            - $ref: '#/components/schemas/User'
          nullable: true
        client_message_id:
          type: string
    SendMessageRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
        parent_id:
          $ref: '#/components/schemas/UUID'
        forwarded_from:
          type: object
          additionalProperties: true
          nullable: true
        quoted_message_id:
          $ref: '#/components/schemas/UUID'
        quoted_snapshot:
          $ref: '#/components/schemas/QuotedSnapshot'
        client_message_id:
          type: string
        file_ids:
          description: Library file ids to atomically share into the target chat before message persistence.
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/UUID'
    EditMessageRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
    Reaction:
      type: object
      required:
        - id
        - message_id
        - user_id
        - emoji
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        message_id:
          $ref: '#/components/schemas/UUID'
        user_id:
          $ref: '#/components/schemas/UUID'
        emoji:
          type: string
        created_at:
          $ref: '#/components/schemas/IsoDatetime'
    AddReactionRequest:
      type: object
      required:
        - emoji
      properties:
        emoji:
          type: string
          minLength: 1
    Attachment:
      type: object
      required:
        - id
        - message_id
        - file_name
        - file_size
        - mime_type
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        message_id:
          $ref: '#/components/schemas/UUID'
        file_name:
          type: string
        file_size:
          type: integer
        mime_type:
          type: string
        url:
          type: string
          nullable: true
        created_at:
          $ref: '#/components/schemas/IsoDatetime'
    FileOwner:
      type: object
      required: [id, display_name]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        display_name: { type: string }
        avatar_url: { type: string, nullable: true }


    FileSharedTarget:
      type: object
      required: [type, target_id, workspace_id, display_name]
      properties:
        type: { type: string, enum: [channel, dm] }
        target_id: { $ref: '#/components/schemas/UUID' }
        workspace_id: { $ref: '#/components/schemas/UUID' }
        display_name: { type: string }
        avatar_url: { type: string, nullable: true }
        member_count: { type: integer, nullable: true }


    FileTypeFacet:
      type: object
      required: [type, count]
      properties:
        type: { type: string, enum: [image, document, archive, video, audio, code] }
        count: { type: integer }


    FileChatFacet:
      allOf:
        - $ref: '#/components/schemas/FileSharedTarget'
        - type: object
          required: [count]
          properties:
            count: { type: integer }


    FileListFacets:
      type: object
      required: [types, chats]
      properties:
        types:
          type: array
          items: { $ref: '#/components/schemas/FileTypeFacet' }
        chats:
          type: array
          items: { $ref: '#/components/schemas/FileChatFacet' }


    LibraryFile:
      type: object
      required: [id, user_id, workspace_id, filename, extension, mime_type, size, created_at, starred, owner, shared_with]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        user_id: { $ref: '#/components/schemas/UUID' }
        workspace_id: { $ref: '#/components/schemas/UUID' }
        filename: { type: string }
        extension: { type: string }
        mime_type: { type: string }
        size: { type: integer, format: int64 }
        created_at: { $ref: '#/components/schemas/IsoDatetime' }
        starred: { type: boolean }
        preview_url: { type: string, nullable: true }
        owner: { $ref: '#/components/schemas/FileOwner' }
        shared_with:
          type: array
          items: { $ref: '#/components/schemas/FileSharedTarget' }


    FileListResponse:
      type: object
      required: [files, total_count, total_bytes, facets]
      properties:
        files:
          type: array
          items: { $ref: '#/components/schemas/LibraryFile' }
        next_cursor: { type: string, nullable: true }
        total_count: { type: integer }
        total_bytes: { type: integer, format: int64 }
        facets: { $ref: '#/components/schemas/FileListFacets' }


    FileStorageUsage:
      type: object
      required: [used_bytes, limit_bytes, upload_limits]
      properties:
        used_bytes: { type: integer, format: int64 }
        limit_bytes: { type: integer, format: int64 }
        upload_limits:
          type: object
          required: [image, document, text, archive, video, audio]
          properties:
            image: { type: integer, format: int64 }
            document: { type: integer, format: int64 }
            text: { type: integer, format: int64 }
            archive: { type: integer, format: int64 }
            video: { type: integer, format: int64 }
            audio: { type: integer, format: int64 }


    FileDownloadURL:
      type: object
      required: [url, file_id, filename, extension, mime_type, size]
      properties:
        url: { type: string }
        file_id: { $ref: '#/components/schemas/UUID' }
        filename: { type: string }
        extension: { type: string }
        mime_type: { type: string }
        size: { type: integer, format: int64 }


    FileShareRequest:
      type: object
      required: [type, target_id]
      properties:
        type: { type: string, enum: [channel, user] }
        target_id: { $ref: '#/components/schemas/UUID' }


    FileShare:
      type: object
      required: [id, file_id, type, target_id, created_at]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        file_id: { $ref: '#/components/schemas/UUID' }
        type: { type: string, enum: [channel, user] }
        target_id: { $ref: '#/components/schemas/UUID' }
        created_at: { $ref: '#/components/schemas/IsoDatetime' }


    FileSharesResponse:
      type: object
      required: [shares]
      properties:
        shares:
          type: array
          items: { $ref: '#/components/schemas/FileShare' }


    MessageFile:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        status:
          type: string
          enum: [deleted]
          nullable: true
        filename: { type: string, nullable: true }
        extension: { type: string, nullable: true }
        mime_type: { type: string, nullable: true }
        size: { type: integer, format: int64, nullable: true }
        preview_url: { type: string, nullable: true }


    PresenceEntry:
      type: object
      required:
        - user_id
        - status
        - last_seen_at
      properties:
        user_id:
          $ref: '#/components/schemas/UUID'
        status:
          type: string
          enum:
            - online
            - away
            - dnd
            - offline
        last_seen_at:
          $ref: '#/components/schemas/IsoDatetime'
    SetPresenceRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - online
            - away
            - dnd
            - offline
    Notification:
      type: object
      required:
        - id
        - user_id
        - workspace_id
        - type
        - title
        - body
        - read
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        user_id:
          $ref: '#/components/schemas/UUID'
        workspace_id:
          $ref: '#/components/schemas/UUID'
        type:
          type: string
          enum:
            - mention
            - dm
            - reaction
            - call_invite
            - call_missed
            - channel_join
            - system
        title:
          type: string
        body:
          type: string
        resource_id:
          type: string
        read:
          type: boolean
        created_at:
          $ref: '#/components/schemas/IsoDatetime'
    UnreadCountResponse:
      type: object
      required:
        - unread_count
      properties:
        unread_count:
          type: integer
    SearchResponse:
      type: object
      required:
        - results
        - total
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'
        total:
          type: integer
        next_offset:
          type: integer
    SearchHit:
      type: object
      required:
        - type
        - id
        - workspace_id
        - title
        - snippet
        - score
        - created_at
        - updated_at
      properties:
        type:
          type: string
          enum:
            - message
            - file
            - channel
            - user
        id:
          $ref: '#/components/schemas/UUID'
        workspace_id:
          $ref: '#/components/schemas/UUID'
        channel_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          nullable: true
        title:
          type: string
        snippet:
          type: string
        score:
          type: number
        created_at:
          $ref: '#/components/schemas/IsoDatetime'
        updated_at:
          $ref: '#/components/schemas/IsoDatetime'
        user:
          allOf:
            - $ref: '#/components/schemas/User'
          nullable: true
    GuestInvite:
      type: object
      required:
        - id
        - workspace_id
        - created_by
        - token
        - max_uses
        - use_count
        - status
        - expires_at
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        workspace_id:
          $ref: '#/components/schemas/UUID'
        created_by:
          $ref: '#/components/schemas/UUID'
        token:
          type: string
        email:
          type: string
        channel_ids:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
        call_id:
          allOf:
            - $ref: '#/components/schemas/UUID'
          nullable: true
        max_uses:
          type: integer
        use_count:
          type: integer
        status:
          type: string
          enum:
            - active
            - used
