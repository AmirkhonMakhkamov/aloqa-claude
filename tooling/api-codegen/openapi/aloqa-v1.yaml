            - revoked
        expires_at:
          $ref: '#/components/schemas/IsoDatetime'
        created_at:
          $ref: '#/components/schemas/IsoDatetime'
    CreateInviteRequest:
      type: object
      properties:
        email:
          type: string
        channel_ids:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/UUID'
        max_uses:
          type: integer
          minimum: 0
        ttl_hours:
          type: integer
          minimum: 0
    RedeemInviteRequest:
      type: object
      properties:
        email:
          type: string
        display_name:
          type: string
          maxLength: 128
    WorkspaceMember:
      type: object
      required:
        - id
        - workspace_id
        - user_id
        - role
        - joined_at
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        workspace_id:
          $ref: '#/components/schemas/UUID'
        user_id:
          $ref: '#/components/schemas/UUID'
        role:
          type: string
          enum:
            - owner
